[project]
name = "mlbb-bot"
version = "1.0.0"
description = "Mobile Legends Discord bot — queue, draft, ELO, economy"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "Pillow>=10.0.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__", ".git"]

[tool.ruff.lint]
# Keep rules practical for a legacy Discord bot — no mass rewrite.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear (real bugs)
    "ASYNC",
]
ignore = [
    "E501",    # line length — existing code is long; not a correctness issue
    "B008",    # function calls in defaults (discord.py patterns)
    "UP007",   # X | Y unions — already mostly done; avoid churn
    "UP006",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "F401"]
